<!doctype html>
<html lang="en"><head>

<title>Bugsy Menu Web App</title>

<style>
body{margin:0;background:#0f0d0b}
.c{background:#1c1814;border:1px solid #5a4a30;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.h{font-family:Rye,serif;color:#e0b25c;font-size:24px;margin:0 0 6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;padding:6px 0;color:#efe6d4}
.btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:44px;font:inherit;font-size:17px;color:#efe6d4;background:#2a231b;border:1px solid #6b5636;border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.btn:hover{background:#352c21;border-color:#e0b25c}
.on{background:#3d2f1d;border-color:#e0b25c}
.p{color:#e0b25c;font-weight:600;white-space:nowrap}
.hh{color:#ff9a6b;font-weight:600;white-space:nowrap}
.s{font-family:Lora,serif;font-style:italic;color:#b8a98c;font-size:14px}
.bub{background:#efe6d4;color:#1c1814;border-radius:14px;padding:18px 20px;margin:2px 0 8px;font-family:Lora,serif;font-size:19px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.plus{color:#e0b25c;font-size:13px;letter-spacing:1px}

html,body{background:#0f0d0b}
.wrap{box-sizing:border-box;max-width:1200px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));color:#efe6d4;font-family:Oswald,'Arial Narrow',sans-serif;display:flex;flex-direction:column;gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px;align-items:start}
.btn:focus-visible{outline:3px solid #e0b25c;outline-offset:2px}
</style></head><body>

{t:"Handhelds",note:"With fries · Try any sandwich as a wrap",i:[

{t:"Fries & Drinks",i:[

["Sweet Potato Fries sm / lg","$5 / $7"],["Tator Tots sm / lg","$5 / $7"],["Onion Rings sm / lg","$5 / $7"],
["Fountain Drinks","$3","Coke, Diet Coke, Sprite, Ginger Ale, Lemonade"],
["Juices","$3.50","Pineapple, Orange, Cranberry"],["Ginger Beer","$3.50"]]}];

const g=document.getElementById('g');
S.forEach(s=>{
 const c=document.createElement('div');c.className='c';if(s.hh)c.style.borderColor='#ff9a6b';
 const h=document.createElement('h2');h.className='h';h.textContent=s.t;if(s.hh)h.style.color='#ff9a6b';c.appendChild(h);
 const pc=s.hh?'hh':'p';
 s.i.forEach(x=>{
  const w=document.createElement('div');
  const price=document.createElement('span');price.className=pc;price.textContent=x[1];
  if(x[2]){
   const b=document.createElement('button');b.type='button';b.className='btn';b.setAttribute('aria-expanded','false');
   const n=document.createElement('span');n.textContent=x[0]+' ';const a=document.createElement('span');a.className='plus';a.textContent='▾';n.appendChild(a);
   b.append(n,price);
   const bub=document.createElement('div');bub.className='bub';bub.textContent=x[2];bub.hidden=true;
   b.onclick=()=>{const o=bub.hidden;bub.hidden=!o;b.classList.toggle('on',o);a.textContent=o?'▴':'▾';b.setAttribute('aria-expanded',o)};
   w.append(b,bub);
  }else{const r=document.createElement('div');r.className='r';const n=document.createElement('span');n.textContent=x[0];r.append(n,price);w.appendChild(r)}
  c.appendChild(w);
 });
 if(s.note){const n=document.createElement('div');n.className='s';n.textContent=s.note;c.appendChild(n)}
 g.appendChild(c);
});
