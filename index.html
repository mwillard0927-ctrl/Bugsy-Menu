<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugsy's Menu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bugsy's">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;600&family=Lora:ital@0;1&display=swap">
<style>
body{margin:0;background:#0f0d0b}
.c{background:#1c1814;border:1px solid #5a4a30;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.h{font-family:Rye,serif;color:#e0b25c;font-size:24px;margin:0 0 6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;padding:6px 0;color:#efe6d4}
.btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:44px;font:inherit;font-size:17px;color:#efe6d4;background:#2a231b;border:1px solid #6b5636;border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.btn:hover{background:#352c21;border-color:#e0b25c}
.on{background:#3d2f1d;border-color:#e0b25c}
.p{color:#e0b25c;font-weight:600;white-space:nowrap}
.hh{color:#ff9a6b;font-weight:600;white-space:nowrap}
.s{font-family:Lora,serif;font-style:italic;color:#b8a98c;font-size:14px}
.bub{background:#efe6d4;color:#1c1814;border-radius:14px;padding:18px 20px;margin:2px 0 8px;font-family:Lora,serif;font-size:19px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.plus{color:#e0b25c;font-size:13px;letter-spacing:1px}

html,body{background:#0f0d0b}
body{position:relative}
.wrap{box-sizing:border-box;max-width:1200px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));color:#efe6d4;font-family:Oswald,'Arial Narrow',sans-serif;display:flex;flex-direction:column;gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px;align-items:start}
.btn:focus-visible{outline:3px solid #e0b25c;outline-offset:2px}
.hdr{position:relative}
#qrCorner{position:absolute;top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));width:8.333vw;min-width:44px;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:5}
#qrCorner .ar{color:#e0b25c;font-size:22px;line-height:1}
#qrCorner .sl{font-family:Oswald,sans-serif;color:#e0b25c;font-size:12px;letter-spacing:2px}
#qrBtn{display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:#fff;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#qrBtn img{width:100%;height:100%;display:block;border-radius:6px}
#qrShade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
#qrBig{position:fixed;z-index:51;border-radius:6px;background:#fff;transform-origin:0 0;display:none;cursor:pointer}
[hidden]{display:none!important}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.info a,.info button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:10px;border:1px solid #6b5636;background:#2a231b;color:#efe6d4;font:600 17px Oswald,sans-serif;letter-spacing:1px;text-decoration:none;cursor:pointer}
.info .order{background:#e0b25c;color:#1c1814;border-color:#e0b25c}
#hrs{background:#1c1814;border:1px solid #5a4a30;border-radius:10px;padding:12px 16px;font-size:16px}
#hrs div{display:flex;justify-content:space-between;padding:3px 0}#hrs .td{color:#e0b25c;font-weight:600}
.banner{border-radius:10px;padding:12px 16px;text-align:center;font:600 19px Oswald,sans-serif;letter-spacing:1px}
.banner.hhon{background:#ff9a6b;color:#1c1814;animation:pulse 2s ease-in-out infinite}
.banner.today{background:#2a231b;border:1px solid #e0b25c;color:#e0b25c}
@keyframes pulse{50%{filter:brightness(1.15)}}
.navw{position:sticky;top:0;z-index:4;background:#0f0d0b;padding:8px 0;display:flex;flex-direction:column;gap:8px}
#q{width:100%;box-sizing:border-box;min-height:46px;border-radius:10px;border:1px solid #6b5636;background:#1c1814;color:#efe6d4;font:17px Oswald,sans-serif;padding:8px 14px}
#q::placeholder{color:#8a7b62}
#nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}#nav::-webkit-scrollbar{display:none}
#nav button{flex:0 0 auto;min-height:38px;border-radius:19px;border:1px solid #6b5636;background:#2a231b;color:#efe6d4;font:600 14px Oswald,sans-serif;padding:6px 14px;cursor:pointer;white-space:nowrap}
.c{scroll-margin-top:120px}
.tag{font:600 11px Oswald,sans-serif;letter-spacing:1px;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tag.new{background:#3fa34d;color:#fff}.tag.so{background:#7a2e2e;color:#fff}
.soldout{opacity:.45}.soldout .p,.soldout .hh{text-decoration:line-through}
.todayItem{outline:2px solid #e0b25c;border-radius:8px}
#none{text-align:center;color:#b8a98c;font-family:Lora,serif;font-style:italic}
</style></head><body>
<div id="qrCorner"><button id="qrBtn" aria-label="Show QR code to share"><img src="qr.png" alt="QR code"></button><div class="ar">&#8593;</div><div class="sl">SHARE</div></div>
<div class="wrap">
<div class="hdr" style="text-align:center;display:flex;flex-direction:column;gap:6px">
<div style="font-family:Rye,serif;font-size:clamp(52px,14vw,84px);color:#e0b25c;line-height:1">BUGSY'S</div>
<div style="font-size:clamp(15px,4vw,24px);letter-spacing:6px;color:#c9b892">BAR &amp; GRILL MENU</div>
<div class="s" style="font-size:16px">Tap any item with ▾ to see what's in it. Tap again to close.</div>
</div>
<div class="info">
<a id="orderBtn" class="order" href="#" target="_blank" rel="noopener" hidden>🛒 ORDER ONLINE</a>
<a id="callBtn" href="#" hidden>📞 CALL</a>
<a id="dirBtn" href="#" target="_blank" rel="noopener" hidden>📍 DIRECTIONS</a>
<button id="hrsBtn" type="button" hidden>🕒 HOURS</button>
</div>
<div id="hrs" hidden></div>
<div id="hhBanner" class="banner hhon" hidden></div>
<div id="todayBanner" class="banner today" hidden></div>
<div class="navw"><input id="q" type="search" placeholder="Search the menu…" aria-label="Search the menu"><div id="nav"></div></div>
<div class="grid" id="g"></div>
<div id="none" hidden>No items match your search.</div>
<div class="s" style="text-align:center;font-size:15px">Happy hour &amp; daily specials are dine in only. Come hungry, leave happy.</div>
</div>
<script>
/* ===== Bugsy's settings — fill these in, blanks stay hidden ===== */
const CONFIG={
 orderUrl:"",            // Toast online ordering link, e.g. https://order.toasttab.com/online/...
 phone:"586-751-2554",
 address:"1980 E 12 Mile Rd, Warren, MI 48092",
 hours:{Sun:"12 PM – 11 PM",Mon:"11 AM – 12 AM",Tue:"11 AM – 12 AM",Wed:"11 AM – 12 AM",Thu:"11 AM – 1 AM",Fri:"11 AM – 2 AM",Sat:"11 AM – 2 AM"},
 happyHour:{days:[1,2,3,4,5],start:11,end:17}            // Mon–Fri 11–5
};
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'],DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=id=>document.getElementById(id);
function setupInfo(){
 if(CONFIG.orderUrl){$('orderBtn').href=CONFIG.orderUrl;$('orderBtn').hidden=false}
 if(CONFIG.phone){$('callBtn').href='tel:'+CONFIG.phone.replace(/[^\d+]/g,'');$('callBtn').hidden=false}
 if(CONFIG.address){$('dirBtn').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("Bugsy's Bar & Grill, "+CONFIG.address);$('dirBtn').hidden=false}
 const hv=Object.values(CONFIG.hours).some(Boolean);
 if(hv){const d=new Date().getDay();$('hrs').innerHTML=DN.map((n,i)=>`<div class="${i===d?'td':''}"><span>${n}</span><span>${CONFIG.hours[n]||'—'}</span></div>`).join('');
  $('hrsBtn').hidden=false;$('hrsBtn').onclick=()=>$('hrs').hidden=!$('hrs').hidden}
}
function banners(){
 const n=new Date(),d=n.getDay(),hr=n.getHours()+n.getMinutes()/60,H=CONFIG.happyHour;
 const on=H.days.includes(d)&&hr>=H.start&&hr<H.end;
 const b=$('hhBanner');b.hidden=!on;if(on){const left=Math.round((H.end-hr)*60);b.textContent=`🍺 HAPPY HOUR IS ON NOW · ${left>=60?Math.floor(left/60)+'h '+(left%60)+'m':left+' min'} left`}
 return on;
}
let MENU=null;
function render(){
 const g=$('g'),nav=$('nav');g.innerHTML='';nav.innerHTML='';
 const d=new Date().getDay(),today=DAYS[d],hhOn=banners();
 let secs=MENU.sections.slice();
 // move Happy Hour to the very top when it's on, otherwise Daily Specials first
 const hi=secs.findIndex(s=>s.happyHour),di=secs.findIndex(s=>/special/i.test(s.title));
 const first=hhOn?hi:di;if(first>0){const [s]=secs.splice(first,1);secs.unshift(s)}
 const tb=$('todayBanner'),ts=MENU.sections.flatMap(s=>s.items).find(x=>x.name.startsWith(today+' ·'));
 if(ts){tb.hidden=false;tb.textContent=`⭐ TODAY'S SPECIAL: ${ts.name.split('·')[1].trim()} — ${ts.price}`}
 secs.forEach((s,si)=>{
  const c=document.createElement('div');c.className='c';c.id='sec'+si;if(s.happyHour)c.style.borderColor='#ff9a6b';
  const h=document.createElement('h2');h.className='h';h.textContent=s.title;if(s.happyHour)h.style.color='#ff9a6b';c.appendChild(h);
  const nb=document.createElement('button');nb.type='button';nb.textContent=s.title.split('·')[0].trim();nb.onclick=()=>c.scrollIntoView({behavior:'smooth'});nav.appendChild(nb);
  const pc=s.happyHour?'hh':'p';
  let items=s.items.slice();const tIdx=items.findIndex(x=>x.name.startsWith(today+' ·'));if(tIdx>0){const [t]=items.splice(tIdx,1);items.unshift(t)}
  items.forEach(x=>{
   const w=document.createElement('div');w.className='it';w.dataset.k=(x.name+' '+(x.desc||'')).toLowerCase();
   if(x.soldOut)w.classList.add('soldout');if(x.name.startsWith(today+' ·'))w.classList.add('todayItem');
   const price=document.createElement('span');price.className=pc;price.textContent=x.price;
   const n=document.createElement('span');n.textContent=x.name+' ';
   if(x.isNew){const t=document.createElement('span');t.className='tag new';t.textContent='NEW';n.appendChild(t)}
   if(x.soldOut){const t=document.createElement('span');t.className='tag so';t.textContent='SOLD OUT';n.appendChild(t)}
   if(x.desc){
    const b=document.createElement('button');b.type='button';b.className='btn';b.setAttribute('aria-expanded','false');
    const a=document.createElement('span');a.className='plus';a.textContent='▾';n.appendChild(a);b.append(n,price);
    const bub=document.createElement('div');bub.className='bub';bub.textContent=x.desc;bub.hidden=true;
    b.onclick=()=>{const o=bub.hidden;bub.hidden=!o;b.classList.toggle('on',o);a.textContent=o?'▴':'▾';b.setAttribute('aria-expanded',o)};
    w.append(b,bub);
   }else{const r=document.createElement('div');r.className='r';r.append(n,price);w.appendChild(r)}
   c.appendChild(w);
  });
  if(s.note){const nn=document.createElement('div');nn.className='s';nn.textContent=s.note;c.appendChild(nn)}
  g.appendChild(c);
 });
 filter();
}
function filter(){
 const q=$('q').value.trim().toLowerCase();let any=false;
 document.querySelectorAll('#g .c').forEach(c=>{let k=0;c.querySelectorAll('.it').forEach(it=>{const m=!q||it.dataset.k.includes(q);it.hidden=!m;if(m)k++});c.hidden=!k;if(k)any=true});
 $('none').hidden=any;$('nav').style.display=q?'none':'';
}
$('q').addEventListener('input',filter);
async function load(){
 MENU=await (await fetch('menu.json',{cache:'no-store'})).json();
 // Prices synced from Toast (written nightly by the GitHub job, only once Toast keys are set up)
 try{const t=await (await fetch('toast-menu.json',{cache:'no-store'})).json();const P=t.prices||{};
  MENU.sections.forEach(s=>s.items.forEach(x=>{const k=x.name.toLowerCase();if(P[k]!=null&&!/\//.test(x.price))x.price='$'+(+P[k]).toFixed(2).replace(/\.00$/,'');if(t.outOfStock&&t.outOfStock.includes(k))x.soldOut=true}))}catch(e){}
 render();
}
setupInfo();load();setInterval(()=>{if(MENU)banners()},60000);
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<div id="qrShade"></div><img id="qrBig" src="qr.png" alt="QR code">
<script>
(()=>{const b=document.getElementById('qrBtn'),sh=document.getElementById('qrShade'),big=document.getElementById('qrBig');let open=false,busy=false;
function place(){const r=b.getBoundingClientRect();big.style.left=r.left+'px';big.style.top=r.top+'px';big.style.width=r.width+'px';big.style.height=r.height+'px';return r}
function target(r){const s=Math.min(innerWidth,innerHeight)*0.94;const k=s/r.width;return `translate(${(innerWidth-s)/2-r.left}px,${(innerHeight-s)/2-r.top}px) scale(${k})`}
b.onclick=()=>{if(open||busy)return;busy=true;const r=place();big.style.transition='none';big.style.transform='none';big.style.display='block';b.style.visibility='hidden';sh.style.pointerEvents='auto';
big.offsetWidth;const t='transform 1.5s cubic-bezier(.4,0,.2,1)';big.style.transition=t;sh.style.transition='opacity 1.5s ease';big.style.transform=target(r);sh.style.opacity='1';
setTimeout(()=>{open=true;busy=false},1500)};
function close(){if(!open||busy)return;busy=true;place();big.style.transition='transform .5s cubic-bezier(.4,0,.2,1)';sh.style.transition='opacity .5s ease';big.style.transform='none';sh.style.opacity='0';
setTimeout(()=>{big.style.display='none';b.style.visibility='';sh.style.pointerEvents='none';open=false;busy=false},500)}
sh.onclick=close;big.onclick=close;
addEventListener('resize',()=>{if(open){big.style.transition='none';big.style.transform=target(place())}})})();
</script>
</body></html>
